name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required so npm can exchange a GitHub OIDC token for a short lived publish
  # credential. No npm token is stored in this repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing requires npm 11.5.1 or newer.
      - name: Install a publish capable npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Check the release tag matches the manifest version
        if: github.event_name == 'release'
        run: |
          manifest="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Release tag ${tag} does not match package.json version ${manifest}." >&2
            exit 1
          fi

      # prepublishOnly regenerates tokens and the registry, then runs the full
      # verify suite, so a failing kit cannot reach the registry.
      - name: Publish when the version is new
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "${name}@${version} is already on the registry. Nothing to publish."
            exit 0
          fi
          npm publish
